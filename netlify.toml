# Netlify build settings. Content comes from the committed src/data/projects.csv:
# check (data report) → images (share images) → astro build.
# The Google Sheet sync (npm run sync) is off for now; to turn it back on, set the
# command to "npm run sync && npm run build" with a working SHEET_CSV_URL.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Hashed build assets (CSS, fonts, optimised images) never change: cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
