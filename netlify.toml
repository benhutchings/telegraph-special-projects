# Netlify build settings. Content comes from the Google Sheet on every build:
# sync (sheet → CSV) → check (data report) → images (share images) → astro build.
[build]
  command = "npm run sync && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Hashed build assets (CSS, fonts, optimised images) never change: cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
