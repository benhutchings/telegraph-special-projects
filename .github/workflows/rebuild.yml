# Rebuilds the Netlify site every morning so new rows in the Google Sheet go live
# without anyone doing anything. Can also be run by hand: Actions → "Rebuild site" → Run workflow.
#
# Setup: in Netlify, Site configuration → Build & deploy → Build hooks → Add build hook,
# then add its URL to this GitHub repo as a secret named NETLIFY_BUILD_HOOK
# (Settings → Secrets and variables → Actions → New repository secret).
name: Rebuild site

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily (07:00 in British Summer Time)
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set. See the comment at the top of this file."
            exit 1
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$HOOK?trigger_title=Scheduled+rebuild"
